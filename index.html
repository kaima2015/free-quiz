<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Math</a>
            <a href="science.html">Science</a>
            <a href="art.html">Art</a>
        </nav>
        <h1>Welcome to the math quiz</h1>
    </header>
<main>

    <section>
        <p>What is 12 × 7?</p>
        <h3 id="a1"></h3>
        <button class="btn" data-target="a1" data-correct="true">84</button>
        <button class="btn" data-target="a1" data-correct="false">76</button>
    </section>

    <section>
        <p>What is 3 × 4?</p>
        <h3 id="a2"></h3>
        <button class="btn" data-target="a2" data-correct="false">14</button>
        <button class="btn" data-target="a2" data-correct="true">12</button>
    </section>

    <section>
        <p>What is 14 × 23?</p>
        <h3 id="a3"></h3>
        <button class="btn" data-target="a3" data-correct="false">326</button>
        <button class="btn" data-target="a3" data-correct="true">322</button>
    </section>

    <section>
        <p>What is □ × 8 = 496?</p>
        <h3 id="a4"></h3>
        <button class="btn" data-target="a4" data-correct="true">62</button>
        <button class="btn" data-target="a4" data-correct="false">54</button>
    </section>

    <section>
        <p>368 + 457 = ?</p>
        <h3 id="a5"></h3>
        <button class="btn" data-target="a5" data-correct="true">825</button>
        <button class="btn" data-target="a5" data-correct="false">976</button>
    </section>

    <section>
        <p>1,275 + 489 = ?</p>
        <h3 id="a6"></h3>
        <button class="btn" data-target="a6" data-correct="true">1764</button>
        <button class="btn" data-target="a6" data-correct="false">1675</button>
    </section>

    <section>
        <p>672 ÷ 6 = ?</p>
        <h3 id="a7"></h3>
        <button class="btn" data-target="a7" data-correct="false">14</button>
        <button class="btn" data-target="a7" data-correct="true">112</button>
    </section>

    <section>
        <p>3x + 12 = 30. What is x?</p>
        <h3 id="a8"></h3>
        <button class="btn" data-target="a8" data-correct="false">7</button>
        <button class="btn" data-target="a8" data-correct="true">6</button>
        <button class="btn" data-target="a8" data-correct="false">Trick question</button>
    </section>

</main>
    <footer>
    </footer>
</body>
<script src="index.js"></script>
</html>
